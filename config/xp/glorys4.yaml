# @package _global_

hydra:
  callbacks:
    LogJobReturnCallback:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback

domain: ???
ckpt: null

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false
  deterministic: true
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 1000
  limit_train_batches: 384
  accumulate_grad_batches: 128
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_last: true
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.glorys12.DistinctNormDataModule
  input_da:
    _target_: contrib.glorys12.load_glorys12_data
    tgt_path: /DATASET/GLORYS12/reanalysis/glorys12_2010_2019_4th.nc
    tgt_var: zos
    inp_path: /DATASET/envs/daniel/glorys/glorys4_2010_2019_tracks.nc
    inp_var: input
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2018-11-30']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-12-31']}
    test: null
  xrds_kw:
    patch_dims: {time: 15, lat: 680, lon: 1440}
    strides: {time: 1, lat: 200, lon: 200}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 1}
#   norm_stats:
  ### norm values from inp
    # train:
    # - -0.09863381105990755
    # - 0.701951071208196
    # val:
    # - -0.08194126736755061
    # - 0.7053797013995668
  ### norm values from tgt
#   train:
#   - -0.15534711229031456
#   - 0.7242991039609383
#   val:
#   - -0.13816555296407135
#   - 0.7268575158608895

model:
  _target_: contrib.glorys12.Lit4dVarNetIgnoreNaN
  persist_rw: false
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
      _target_: src.utils.get_triang_time_wei
      patch_dims: ${datamodule.xrds_kw.patch_dims}
      crop: {time: 0, lat: 4, lon: 4}
  solver:
    _target_: src.models.GradSolver
    n_step: 15
    lr_grad: 1e3
    # lr_grad: 0.2
    prior_cost:
      _target_: src.models.BilinAEPriorCost
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 64
      bilin_quad: false
      # bilin_quad: true
      downsamp: 2
    obs_cost:
      _target_: src.models.BaseObsCost
    grad_mod:
      _target_: src.models.ConvLstmGradModel
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 96
  norm_stats: ${datamodule.norm_stats}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.glorys12.train
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    ckpt: ${ckpt}

defaults:
  - /domain: glorys
  - _self_
